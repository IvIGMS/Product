version: '3.8'

services:
  db:
    image: postgres:16
    container_name: products-categories-db
    environment:
      POSTGRES_DB: products-categories
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - products_categories_data:/var/lib/postgresql/data

volumes:
  products_categories_data:
